<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈🦄 Rainbow Unicorn Tic-Tac-Toe 🦄🌈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CHANGE THIS LINE -->
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="title">
                <span class="sparkle">✨</span>
                Rainbow Unicorn Tic-Tac-Toe
                <span class="sparkle">✨</span>
            </h1>
            <p class="subtitle">🦄 Magical Fun for Two Players 🦄</p>
        </header>

        <div class="game-info">
            <div class="player-indicator">
                <span id="current-player-display">Player 1 (🦄) goes first!</span>
            </div>
            <div id="game-status" class="status-message"></div>
        </div>

        <div class="board-container">
            <div id="game-board" class="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <div class="controls">
            <button id="reset-btn" class="reset-button">🔄 Play Again</button>
        </div>
    </div>

    <!-- CHANGE THIS LINE -->
    <script src="static/app.js" defer></script>
</body>
</html>
